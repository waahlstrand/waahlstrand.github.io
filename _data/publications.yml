- title: "Convolutional neural networks and position averaged convergent beam electron diffraction for determining the structure of 2D materials"
  authors: [Andrew B. Yankovich, Magnus Röding, Victor Wåhlstrand Skärström, Alok Ranjan, Eva Olsson]
  venue: Microscopy and Microanalysis
  year: 2023
  category: imaging
  tags: [microscopy, materials]
  summary: >-
    CNNs trained on simulated PACBED patterns recover the phase, composition and
    thickness of 2D materials. Thickness is predicted to within a monolayer.
  links:
