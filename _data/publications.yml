# Publications, newest first.
#
# category: one of the keys in _config.yml -> pub_categories (imaging | humanities)
# tags:     short, generic keywords; reuse existing ones where possible (clicking a tag filters the list)
# authors: list; your own name is highlighted automatically (see _config.yml -> author.match)
# summary: one or two plain sentences; this is what the card shows
# links:   any label -> url; shown in the order given
# image:   optional; path to a figure, e.g. /assets/img/papers/xvfa.png (fills the card's left edge; cropped to fit)
# image_alt: optional; a short description of the image for screen readers

- title: "Vertebral fractures identified on lateral DXA images by deep learning predict incident fractures in older women"
  authors: [Mattias Lorentzon, Victor Wåhlstrand, Jennifer Alvén, Ida Häggström, Lisa Johansson, et al.]
  venue: Osteoporosis International
  year: 2026
  category: imaging
  tags: [fracture risk, survival analysis]
  summary: >-
    In a cohort of 423 women aged 75–80 followed for about eight years, vertebral
    fractures found automatically by XVFA predicted incident fractures as well as
    manual assessment did.
  image: /assets/img/papers/xvfa-survival.jpg
  image_alt: "Kaplan–Meier curves of fracture-free survival, grouped by manual and XVFA vertebral fracture assessment"
  links:
    Paper: https://doi.org/10.1007/s00198-026-08072-9

- title: "Exemplar diffusion: Improving medical object detection with opportunistic labels"
  authors: [Victor Wåhlstrand, Jennifer Alvén, Ida Häggström]
  venue: arXiv preprint
  year: 2026
  category: imaging
  tags: [object detection, generative models, uncertainty]
  summary: >-
    A training-free way to use whatever labels already exist for an image at test
    time to improve diffusion-based object detection. It improves precision and
    recall, is robust to label quality, and gives uncertainty estimates.
  links:
    arXiv: https://arxiv.org/abs/2603.15267

- title: "‘Do you want to know who you are?’ The rise of genetic ancestry testing and the search for genealogies"
  authors: [Kristian Kristiansen, Victor Wåhlstrand, Daniel Brodén, Mats Ahlgren, Marie Louise Stig Sørensen, Michael Rowlands, Hannes Schroeder]
  venue: Current Swedish Archaeology
  year: 2026
  category: humanities
  tags: [archaeology, survey]
  summary: >-
    A survey of nearly 900 Swedes who took consumer DNA tests. Most were motivated by
    family history rather than national identity.
  links:
    Paper: https://doi.org/10.37718/CSA.2025.02

- title: "Patch-level attribution of multimodal fracture risk prediction"
  authors: [Victor Wåhlstrand, Erik Blomqvist, Jennifer Alvén, Lisa Johansson, Mattias Lorentzon, Ida Häggström]
  venue: MLMI workshop, MICCAI
  year: 2025
  category: imaging
  tags: [fracture risk, explainability, multimodal]
  summary: >-
    An annotation-free multimodal model that predicts fracture risk from low-dose
    spine X-rays and attributes the risk to individual vertebrae. Adding
    vertebral-body patches clearly improves C-index and Brier score over clinical baselines.
  image: /assets/img/papers/patch-attribution.jpg
  image_alt: "Integrated-gradients attribution maps over three vertebral-body patches from spine X-rays"
  links:
    Paper: https://doi.org/10.1007/978-3-032-09513-8_41

- title: "Separable tissue representations for attributable risk prediction"
  authors: [Victor Wåhlstrand, Jennifer Alvén, Lisa Johansson, Kristian Axelsson, Mattias Lorentzon, Ida Häggström]
  venue: MICCAI
  year: 2025
  category: imaging
  tags: [fracture risk, explainability, multimodal, representation learning]
  summary: >-
    STRAP, a masked autoencoder over a variable number of patch tokens, lets bone and
    soft tissue in HR-pQCT enter a fracture risk model separately. Including soft
    tissue measurably improves prediction.
  image: /assets/img/papers/strap.jpg
  image_alt: "Attribution map over an HR-pQCT cross-section, separating bone from soft tissue"
  links:
    Paper: https://doi.org/10.1007/978-3-032-05185-1_54

- title: "Sticks and stones may break your bones: Explainable methods for fracture risk prediction"
  authors: [Victor Wåhlstrand]
  venue: Licentiate thesis, Chalmers University of Technology
  year: 2025
  category: imaging
  tags: [fracture risk, explainability, survival analysis]
  summary: >-
    Explainable methods for detecting vertebral fractures and forecasting future
    fractures from DXA and HR-pQCT. They perform on par with or better than black-box
    alternatives.
  links:
    Thesis: https://research.chalmers.se/en/publication/547786

- title: "Impact of deep learning model uncertainty on manual corrections to MRI-based auto-segmentation in prostate cancer radiotherapy"
  authors: [Viktor Rogowski, Angelica Svalkvist, Matteo Maspero, Tomas Janssen, et al., Victor Wåhlstrand, et al.]
  venue: Journal of Applied Clinical Medical Physics
  year: 2025
  category: imaging
  tags: [segmentation, uncertainty]
  summary: >-
    Showing clinicians voxel-wise uncertainty maps cut editing time for most
    oncologists and halved edits in low-uncertainty regions.
  links:
    Paper: https://doi.org/10.1002/acm2.70221

- title: "Seafaring and navigation in the Nordic Bronze Age"
  authors: [Boel Bengtsson, Alvaro Montenegro, Ashely Green, Matteo Tomasini, Martyn Prince, Victor Wåhlstrand Skärström, Knut Ivar Austvoll, Johan Ling, Cecilia Lindhé]
  venue: PLOS ONE
  year: 2025
  category: humanities
  tags: [simulation, archaeology]
  summary: >-
    Agent-based voyage simulation combined with boat performance data suggests that
    direct open-water crossings between Jutland and Norway were feasible in the Bronze Age.
  image: /assets/img/papers/seafaring.jpg
  image_alt: "Map of the Skagerrak crossing between Lista and Thy, with visibility distances marked"
  links:
    Paper: https://doi.org/10.1371/journal.pone.0320791
    Code: https://github.com/waahlstrand/voyager

- title: "Explainable vertebral fracture analysis with uncertainty estimation using differentiable rule-based classification"
  authors: [Victor Wåhlstrand Skärström, Lisa Johansson, Jennifer Alvén, Mattias Lorentzon, Ida Häggström]
  venue: MICCAI
  year: 2024
  category: imaging
  tags: [explainability, uncertainty]
  summary: >-
    XVFA detects vertebrae, localises keypoints with calibrated uncertainty, and
    classifies fractures with differentiable Genant rules. It reaches 97% end-to-end
    AUC, and its decisions can be read in clinical terms.
  image: /assets/img/papers/xvfa.jpg
  image_alt: "Predicted vertebra keypoints with uncertainty regions on a low-dose lateral spine radiograph"
  links:
    Paper: https://papers.miccai.org/miccai-2024/301-Paper1871.html
    arXiv: https://arxiv.org/abs/2407.02926
    Code: https://github.com/waahlstrand/XVFA

