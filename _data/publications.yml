- title: "Inverse design of anisotropic spinodoid materials with prescribed diffusivity"
  authors: [Magnus Röding, Victor Wåhlstrand Skärström, Niklas Lorén]
  venue: Scientific Reports
  year: 2022
  category: imaging
  tags: [materials, inverse design]
  summary: >-
    A CNN surrogate for directional diffusivity inside approximate Bayesian
    computation designs porous spinodoid microstructures with prescribed diffusion
    along each axis.
  image: /assets/img/papers/spinodoid.jpg
  image_alt: "3D rendering of a generated anisotropic spinodoid microstructure"
  links:
    Paper: https://doi.org/10.1038/s41598-022-21451-6

- title: "A boat is a boat is a boat… unless it is a horse – Rethinking the role of typology"
  authors: [Christian Horn, Ashely Green, Victor Wåhlstrand Skärström, Cecilia Lindhé, Mark Peternell, Johan Ling]
  venue: Open Archaeology
  year: 2022
  category: humanities
  tags: [archaeology, classification]
  summary: >-
    Machine learning and human experts both bring biases to classifying Bronze Age
    rock art, but machines apply them consistently. The algorithm’s apparent
    mistakes point to real ambiguity in the typology.
  links:
    Paper: https://doi.org/10.1515/opar-2022-0277

- title: "The new order of criticism. Explorations of book reviews between the interpretative and algorithmic"
  authors: [Jonas Ingvarsson, Daniel Brodén, Lina Samuelsson, Victor Wåhlstrand Skärström, Niklas Zechner]
  venue: DHNB
  year: 2022
  category: humanities
  tags: [literary studies, text mining, mixed methods]
  summary: >-
    Language technology and discourse analysis applied together to about 700 Swedish
    book reviews from 1906, 1956 and 2006. Word statistics partly confirm the themes
    found by close reading and show shifts in critical vocabulary over the century.
  links:
    Paper: https://ceur-ws.org/Vol-3232/paper20.pdf

- title: "Unifying or divisive threats? Anxiety about political terrorism and extremism among the Swedish public and parliamentarians, 1986–2020"
  authors: [Patrik Öhberg, Daniel Brodén, Mats Fridlund, Victor Wåhlstrand Skärström, Magnus P. Ängsal]
  venue: DHNB
  year: 2022
  category: humanities
  tags: [terrorism, parliamentary records, survey]
  summary: >-
    National survey data and parliamentary motions show that right-leaning citizens
    and politicians worry more about terrorism, left-leaning ones more about
    extremism, and that both concerns spike after major attacks.
  links:
    Paper: https://ceur-ws.org/Vol-3232/paper11.pdf

- title: "The market as a concept in Swedish parliamentary records from 1867 to 1970: A mixed methods study"
  authors: [Claes Ohlsson, Victor Wåhlstrand Skärström, Henrik Björck]
  venue: DiPaDA workshop, DHNB
  year: 2022
  category: humanities
  tags: [parliamentary records, text mining, mixed methods]
  summary: >-
